{% extends 'base.html' %}

{% block content %}
{% load static %}

<h3 class="h3 p-2">Alot Movie in Theater</h3><hr>

<form id="movieInTheaterForm" method="POST" style="display: flex;">
    
    {% csrf_token %}

    <div id="firstDiv">

        <select name="citySelect" id="citySelect" class="border border-black px-3 py-2 mt-4 ms-2">
            <option value="null">Select city</option>
            {% for city in cities %}
            <option value="{{city.id}}">{{city.name}}</option>
            {% endfor %}
        </select><br>
            
        <select name="locationSelect" id="locationSelect" class="border border-black px-3 py-2 mt-4 ms-2">
            <option value="null">Select location</option>
        </select><br>
        
                
        <select name="theaterSelect" id="theaterSelect" class="border border-black px-3 py-2 mt-4 ms-2">
            <option value="null">Select theater</option>
        </select><br>
        
                    
        <select name="screenSelect" id="screenSelect" class="border border-black px-3 py-2 mt-4 ms-2">
            <option value="null">Select theater</option>
        </select><br>
                        
                    
        <select name="movieSelect" id="movieSelect" class="border border-black px-3 py-2 mt-4 ms-2">
            <option value="null">Select Movie</option>
            {% for movie in movies %}
            <option value="{{movie.id}}">{{movie.name}}</option>
            {% endfor %}
        </select><br>

        <input type="date" name="releaseDate" id="releaseDate" placeholder="Enter the Release Date" class="border border-black px-3 py-2 mt-4 ms-2"><br>

        <input type="date" name="toDate" id="toDate" placeholder="Enter the Closing Date" class="border border-black px-3 py-2 mt-4 ms-2"><br>

        <input type="button" id="nextButton" value="Next" class="btn btn-primary px-3 mt-4 ms-2 px-5">


    </div>


    <div id="secondDiv" style="display: none;padding-left: 50px;">

        <input type="number" placeholder="Enter the number of shows" name="noOfShow" id="noOfShow" class="border border-black px-3 py-2 mt-4 ms-2"><br><Br>
        <input type="button" id="enterButton" value="Enter" class="border border-black px-3 py-2 mt-4 ms-2"><br><Br>
    </div>

    

</form>

<script src="{% static 'js/adminPanel.js' %}"></script>

<script>


    document.querySelector("#nextButton").addEventListener('click' , function(){

        // GENERATED CODE FROM CHATGPT NOT WRITTEN BY YOUR SELF
        let fields = document.querySelectorAll("select, input[type='date']");

        for (let field of fields) {

            if (field.value == "" || field.value == "null") {
                alert("Please fill all the fields.");
                field.focus();
                return;
            }

        }
        
        document.querySelector("#secondDiv").style.display = 'block'

    })


    document.querySelector("#enterButton").addEventListener('click' , function(){

        console.log("enter buttom clicked")
        document.querySelector("#enterButton").disabled = true
        let no_of_entry = parseInt(document.querySelector("#noOfShow").value)

        for(let i = 0 ; i < no_of_entry ; i++)
        {
               document.querySelector("#secondDiv").innerHTML += `
                    <input type='time' name='showTime' id='showTime'><Br><Br>
               `
        }

        document.querySelector("#secondDiv").innerHTML += `
            <input type="submit" value="Add" id="addbtn" class="btn btn-primary px-5"><br><br>
            <p id="result"></p>
        `

    })


    $(document).ready(function(){

        console.log("Movie In Theater Page")
        
        $("#movieInTheaterForm").submit(function(event){

            event.preventDefault()

            $.ajax({
                url : "",
                type : "POST",
                data : $(this).serialize(),
                success : function(res)
                {
                    if(res.status)
                    {
                        $("#result").html(`<p class="alert alert-success">${res.message}</p>`) 
                        setTimeout(()=>{
                            window.location.reload()  
                        } , 1000)
                    }
                    else
                    {
                        $("#result").html(`<p class="alert alert-danger">${res.message}</p>`)   
                    }
                }
            })

        })

    })

</script>


{% endblock %}
