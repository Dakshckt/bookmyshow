{% extends "base.html" %}

{% block content %}
{% load static %}

<h3 class="h3 p-2">Screen Page</h3><hr>


<div class="container">
    <div class="row">
        <div class="col-md-6 col-12 parentBoxDesign">
            <div class="boxDesign">

                
                <form id="screenForm" method="POST">

                    {% csrf_token %}
                <!-- ? The city select is comming from teh common adminPanel js file for all the city select options  -->
                    <select name="citySelect" id="citySelect" class="border border-black px-3 py-2 mt-4 ms-2">
                        <option value="null">Select city</option>
                        {% for city in cities %}
                        <option value="{{city.id}}">{{city.name}}</option>
                        {% endfor %}
                    </select><br>
                        
                    <select name="locationSelect" id="locationSelect" class="border border-black px-3 py-2 mt-4 ms-2">
                        <option value="null">Select location</option>
                    </select><br>
                    
                    
                    <select name="theaterSelect" id="theaterSelect" class="border border-black px-3 py-2 mt-4 ms-2">
                    <option value="null">Select theater</option>
                    </select><br>

                    <input type="text" name="screenName" id="screenName" placeholder="Enter the Name of Screen" class="border border-black px-3 py-2 mt-4 ms-2"><br>

                    <input type="submit" value="submit" name="submit" class="btn btn-primary px-3 mt-4 ms-2 px-5">

                    <br><br><Br><p id="result"></p>

                </form>

            </div>
        </div>
        <div class="col-md-6 col-12 parentBoxDesign">
            <div class="boxDesign">

                Display

            </div>
        </div>
    </div>
</div>


<!-- ? The city select is comming from teh common adminPanel js file for all the city select options  -->
<script src="{% static 'js/adminPanel.js' %}"></script>
<script>

    $(document).ready(function(){

        console.log("screen page")

        $("#screenForm").submit(function(event){

            event.preventDefault()

            $.ajax({
                url : "",
                type : "POST",
                data : $(this).serialize(),
                success : function(res){

                    if(res.status)
                    {
                        $("#result").html(`<p class="alert alert-success">${res.message}</p>`)   
                        $("#screenName").val('')
                    }
                    else
                    {
                        $("#result").html(`<p class="alert alert-danger">${res.message}</p>`)   
                    }

                }
            })

        })

    })  

</script>

{% endblock %}
