
{% extends 'base.html' %}

{% block content %}

<style>
    body {
        background-color: #f5f6fa;
    }

    .login-container {
        min-height: 75vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 25px 15px;
    }

    .login-card {
        background: #ffffff;
        border: 1px solid #eeeeF5;
        border-radius: 14px;
        padding: 35px;
        width: 100%;
        max-width: 450px;
    }

    .login-icon {
        width: 65px;
        height: 65px;
        background: #eeecff;
        color: #635bdb;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin: 0 auto 20px;
    }

    .login-title {
        color: #252538;
        font-weight: 600;
        text-align: center;
    }

    .login-subtitle {
        color: #888899;
        font-size: 14px;
        text-align: center;
        margin-bottom: 28px;
    }

    .form-label {
        color: #444455;
        font-weight: 500;
        margin-bottom: 8px;
    }

    .form-control {
        padding: 12px 14px;
        border-radius: 7px;
        border: 1px solid #ddddE8;
    }

    .form-control:focus {
        border-color: #635bdb;
        box-shadow: 0 0 0 0.15rem rgba(99, 91, 219, 0.12);
    }

    .login-btn {
        background-color: #635bdb;
        color: white;
        padding: 11px;
        border-radius: 7px;
        border: none;
        font-weight: 500;
        width: 100%;
        margin-top: 10px;
    }

    .login-btn:hover {
        background-color: #5149c5;
        color: white;
    }

    #result {
        font-size: 14px;
        text-align: center;
    }
</style>

<div class="container login-container">

    <div class="login-card">

        <div class="login-icon">
            <i class="bi bi-person-lock"></i>
        </div>

        <h3 class="login-title">Welcome Back!</h3>

        <p class="login-subtitle">
            Login to continue to your account.
        </p>

        <form id="loginForm" method="post">

            {% csrf_token %}

            <!-- Email -->
            <div class="mb-3">

                <label class="form-label">Email Address</label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <!-- Password -->
            <div class="mb-3">

                <label class="form-label">Password</label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <!-- Submit -->
            <input
                type="submit"
                name="submit"
                value="Login"
                class="btn login-btn"
            >

            <div class="mt-4" id="result"></div>

        </form>

    </div>

</div>

<script>

    $(document).ready(function(){

        console.log("Login Page");

        $("#loginForm").submit(function(event){

            event.preventDefault();

            $.ajax({
                url: "",
                type: "POST",
                data: $(this).serialize(),

                success: function(res){

                    if(res.status)
                    {
                        $("#result").html(res.message);

                        setTimeout(function(){

                            if(res.user_status)
                            {
                                window.location.href = "/home/";
                            }
                            else
                            {
                                window.location.href = "/client/home/";
                            }

                        }, 1000);

                    }
                    else
                    {
                        $("#result").html(res.message);
                    }

                }

            });

        });

    });

</script>

{% endblock %}
