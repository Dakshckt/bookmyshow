{% extends "base.html" %}

{% block content %}



<h3 class="h3 p-2">City Page</h3><hr class="mb-5">

<div class="container">

    <div class="row" style="padding: 0px;">

        <div class="col-md-6 col-12 parentBoxDesign">

            <div class=" boxDesign">
    
                <form id="cityForm" method="post">
    
                    {% csrf_token %}
                    <input type="text" name="cityname" id="cityname" placeholder="Enter Name of the city" class="border border-black px-3 py-2">
                    <Br><input type="submit" name="submit" value="Add City" class="btn btn-primary px-3 mt-3 px-5">
    
                    <br><Br><Br>
                    <p id="result"></p>
    
                </form>

            </div>

        </div>
        <div class="col-md-6 col-12 parentBoxDesign">

            <div class="boxDesign">

                <ul class="">
                    {% for city in cities %}
                        <li class="alert alert-warning">{{city.name}}</li>
                    {% endfor %}
                </ul>

            </div>

        </div>

    </div>

</div>

<script>

    $(document).ready(function(){

        console.log("City Page")

        $("#cityForm").submit(function(event){

            event.preventDefault()

            $.ajax({
                url : "",
                type : "POST",
                data : $(this).serialize(),
                success : function(res){

                    if(res.status == true)
                    {
                        $("#result").html(`<p class="alert alert-success">${res.message}</p>`)  
                        $("#cityname").val("") 
                    }
                    else
                    {
                        $("#result").html(`<p class="alert alert-danger">${res.message}</p>`)   
                    }

                }
            })

        })

    })

</script>

{% endblock %}
