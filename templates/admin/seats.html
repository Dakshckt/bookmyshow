{% extends "base.html" %}

{% block content %}
{% load static %}

<h3 class="h3 p-2">Seats Page</h3><hr>


<form id="seatForm" method="post">
    {% csrf_token %}

<!-- ? The city select is comming from teh common adminPanel js file for all the city select options  -->
    <select name="citySelect" id="citySelect" class="border border-black px-3 py-2 mt-4 ms-2">
        <option value="null">Select city</option>
        {% for city in cities %}
        <option value="{{city.id}}">{{city.name}}</option>
        {% endfor %}
    </select><br>
        
    <select name="locationSelect" id="locationSelect" class="border border-black px-3 py-2 mt-4 ms-2">
        <option value="null">Select location</option>
    </select><br>
    
    
    <select name="theaterSelect" id="theaterSelect" class="border border-black px-3 py-2 mt-4 ms-2">
    <option value="null">Select theater</option>
    </select><br>


    <select name="screenSelect" id="screenSelect" class="border border-black px-3 py-2 mt-4 ms-2">
    <option value="null">Select Screen</option>
    </select><br>



    
    <input type="number" name="row" id="row" placeholder="Enter the number of rows" class="border border-black px-3 py-2 mt-4 ms-2"><br>
    <input type="number" name="seats_per_row" id="seats_per_row" placeholder="Enter the number of seats per Row" class="border border-black px-3 py-2 mt-4 ms-2"><br>
    <input type="button" value="generate" id="generate" class="btn btn-primary px-3 mt-4 ms-2 px-5"><br><br>
    <div id="seatFormDiv">

    </div>
    
</form>



<script src="{% static 'js/adminPanel.js' %}"></script>

<script>

    $(document).ready(function(){

        console.log("seat page")

        $("#seatForm").submit(function(event){

            event.preventDefault()

            $.ajax({
                url : "",
                type : "POST",
                data : $(this).serialize(),
                success : function(res)
                {
                    $("#result").html(`<p class="alert alert-success mt-3">${res.message}</p>`)
                    $("#row").val('')
                    $("#seats_per_row").val('')
                    $("#citySelect").val('')
                    
                    setTimeout(function () {
                        window.location.reload();
                    }, 1500);
                }

            })

        })

    })

</script>

<script>
    
    generateBtn = document.querySelector("#generate")
    seatForm = document.querySelector("#seatForm")

    generateBtn.addEventListener('click' , ()=>{
        
        let row = Number(document.querySelector("#row").value)
        
        for(let i = 0 ; i < row ; i++)
        {
            let alphabet = String.fromCharCode(65 + i)
            
            seatFormDiv.innerHTML += `
                <label>Type of ${alphabet} Row</label>
                <select name="rowType" id="rowType" class="border border-black px-3 py-2 mt-4 ms-2">
                    <option value="VIP">VIP</option>
                    <option value="Gold">Gold</option>
                    <option value="normal" selected>normal</option>
                </select><Br>
            `
        }

        seatFormDiv.innerHTML += `
            <input type="submit" name="submit" value="submit" class="btn btn-primary px-3 mt-4 ms-2 px-5">
            <p id='result'></p><br><Br>
        `
    })

</script>

{% endblock %}
