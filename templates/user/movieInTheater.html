{% extends "base.html" %}


{% block content %}
{% load static %}


<div class="container">

    <div class="p-4">
        <h3 class="h1 fw-bolder">{{ movies.name }}</h3>
        {% csrf_token %}
        <label for="locationSelect" class="mt-4">Following are the locations of the theaters the movie is streaming</label><br><br>
        <select name="locationSelect" id="locationSelect" class="border border-black px-3 py-2 mb-3 rounded-2">
            <option value="null">Select the location</option>
            {% for location in location_list %}
            <option value="{{location.id}}" >{{location.name}}</option>
            {% endfor %}
        </select>
        <input type="text" name="movieId" id="movieId" value="{{movies.id}}" hidden>

    </div>
    <div class="bg-light"> 
        <div id="dates_text_heading">
            <h5 class="h5 px-3 pt-4 pb-2 fw-bolder">Select The Date :</h5>
        </div>   
        <div class="px-3 pb-4" style="display: flex;flex-wrap: wrap;" id="dateDisplay">
            
            
            
        </div>
    </div>
    <div class="p-4 bg-light" id="displayTheaters">

        

    
    </div>

</div>


<script>

    $(document).ready(function(){

        console.log("Moive in theater page client")
        $("#dates_text_heading").hide()


        $("#locationSelect").change(function(event){

            event.preventDefault()

            $.ajax({
                url : "/client/send-date/",
                type : "POST",
                data : {
                    location_id : $(this).val(),
                    movie_id : $("#movieId").val(),
                    csrfmiddlewaretoken:$("input[name='csrfmiddlewaretoken']").val()
                },
                success : function(res)
                {


                    if(res.status)
                    {
                        all_dates = res.all_dates

                        $("#dateDisplay").html("")
                        
                        let first_time = true

                        all_dates.forEach(element => {
                            
                            result = $("#dateDisplay").html()
                            if(first_time)
                            {
                                $("#dates_text_heading").hide()
                               first_time = false    
                            }

                            $("#dateDisplay").html(result + `<br>

                                <button class="btn btn-outline-dark me-2 mt-2 p-2 dateCard" data-date="${element}">${formatDate(element)}</button>

                            `)

                        });

                        $("#displayTheaters").html("")
                        $("#dates_text_heading").show()
                    }
                    else
                    {
                        alert(res.message)
                    }

                    // THIS IS FROM THE BELOW CODE WAS TAKEN 


                }

            })

        })


        $(document).on('click' , ".dateCard" , function(){

            $(".dateCard").removeClass("bg-red-600 text-white border-red-600");

            $(this).addClass("bg-red-600 text-white border-red-600");

            date_selected = $(this).data("date")
            // alert("Date Selected : " + date_selected)

            $.ajax({
                url : "/client/send-shows/",
                type : "POST",
                data : {
                    location_id : $("#locationSelect").val(),
                    movie_id : $("#movieId").val(),
                    selected_date : date_selected,
                    csrfmiddlewaretoken:$("input[name='csrfmiddlewaretoken']").val(),
                },
                success : function(res)
                {

                    
                    if(res.status)
                    {

                        show_timming = res.show_timming
                        $("#displayTheaters").empty()
                        
                        
                        show_timming.forEach(element => {

                            inner_show_time = element.shows_timmings
                            new_screen = ""
                            inner_show_time.forEach(temp => {

                                // Dont know how to do that i am not aware if that 
                                let start = new Date(temp.starting_time).toLocaleTimeString("en-US", {
                                    hour: "2-digit",
                                    minute: "2-digit",
                                    hour12: true
                                });

                                let end = new Date(temp.ending_time).toLocaleTimeString("en-US", {
                                    hour: "2-digit",
                                    minute: "2-digit",
                                    hour12: true
                                });

                                new_screen += `
                                
                                    <div class="border border-success singleScreen px-3 py-2 text-secondary fw-bold" style="width: auto;height: auto;flex-shrink: 0;">
                                        <a href="/client/seats/${temp.show_id}/${temp.show_timming_id}/${date_selected}">${start}</a>
                                        
                                    </div><br>

                                `

                            })
                            
                            $("#displayTheaters").append(`

                                <div class="singleShow col-12 p-3 mb-2" style="background-color:white;width: 100%;">
                                    <div class="row">
                                        <div class="p-2 fw-bold" style="height: 100%;">
                                            
                                            <h4>${element.theater_name} : ${element.screen_name}</h4>

                                        </div><hr>
                                        <div class="py-3 gap-2" style="display: flex;width: 100%;overflow-x: auto;flex-wrap: nowrap;">
                                            
                                            ${new_screen}

                                        </div>    
                                    </div>
                                </div>

                            `)

                        });
                        
                    }
                    else
                    {
                        alert(res.message)
                    }

                }
                
            })

        })
        


    })



    // Function Generated With the Help of the AI ///////////////////////////////

    function formatDate(dateString) {

        let date = new Date(dateString + "T00:00:00");

        let day = date.toLocaleDateString("en-US", {
            weekday: "short"
        });

        let dateNumber = date.toLocaleDateString("en-US", {
            day: "2-digit"
        });

        let month = date.toLocaleDateString("en-US", {
            month: "short"
        });

        return `
            <div class="text-center px-1">
                <div class="fw-bold">${day}</div>
                <div class="fs-4">${dateNumber}</div>
                <div>${month}</div>
            </div>
        `;
    }
    // /////////////////////////////////////////////////////////////////////////////


</script>

{% endblock %}
