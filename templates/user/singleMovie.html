{% extends "base.html" %}


{% block content %}
{% load static %}

<style>

    img{
        height : auto;
        width : 80%;
    }

    #thumbnailImage{
        width: 100%;
        height: auto;
        z-index: 0;
        position: absolute;
    }

    #blackout {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;

        background: radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0, 0, 0, 0.45) 60%,
            rgba(0, 0, 0, 1.0) 100%
        );
        
    }

</style>

<div class="container">

    <div class="row ">
        
        <div class="col-12 bg-gray-100" style="display: flex;align-items: center;justify-content: center;overflow: hidden;position: relative;">
            <img src="/media/{{ movie.poster }}" alt="err" id="thumbnailImage">
            <div id="blackout"></div>
            <div class="col-sm-5 col-12" style="display: flex;justify-content: center;">
                <img src="/media/{{ movie.poster }}" alt="err" style="z-index: 2;">
            </div>
            <div class="col-sm-7 col-0">

            </div>
        </div>
        <div class="col-12 py-5 px-5 bg-light" style="z-index: 2;">
            <h3 class="h1 fw-bolder">{{movie.name}}</h3>
            <p>{{movie.desc}}</p>
            <p class="pt-3">
                {% for element in movie.movie_types %}
                <kbd class="">{{element}}</kbd>
                {% endfor %}
            </p>
            <br><p>{{movie.duration}} Minutes</p>
            <br><Br><Br>
            <button class="btn btn-primary px-4 bookTicket" id="bookTicket" data="{{movie.id}}">Book Tickets</button>
        </div>

    </div>

</div>


<script>

    document.querySelector("#bookTicket").addEventListener('click' , function(element){

        let id = this.getAttribute("data");
        window.location.href = `/client/movie-in-theater/${id}`
    })

</script>


{% endblock %}
