{% extends "base.html" %}


{% block content %}
{% load static %}


<style>
    #card img{
        height: auto;
        width: 100%;
    }
</style>


<div class="container p-4">

    <div class="col-12 p-4" style="display: flex;justify-content:space-between;align-items: center;">
        {% csrf_token %}
        <label for="citySelect" class="h3 fw-bold">SELECT CITY</label>
        <select name="citySelect" id="citySelect" class="px-4 py-2 border border-dark-500 rounded-lg">
            <option value="">Select</option>
            {% for city in cities %}
            <option value="{{ city.id }}"
                {% if request.session.user_selected_city == city.id|stringformat:"s" %}selected{% endif %}
                >{{ city.name }}</option>
            {% endfor %}
        </select>
        
    </div>
    <hr >
    <div class="col-12 p-4">
        <div class="row" id="allCardsDiv">

            {% for movie in movies %}
                <div class="col-3 col-sm-4 col-12 transition-all duration-300 ease-out hover:scale-95 hover:-translate-y-2 hover:shadow-2xl hover:bg-gray-100 hover:z-10 rounded-lg" id="card">
                    <div id="card_part1">
                        <img src="/media/{{ movie.poster }}" alt="err" >
                    </div>
                    <div id="card_part2" class="pb-3">
                        <div id="movie_details">
                            <h4 class="fw-bold h2 h-sm-4 h-md-3">{{movie.name}}</h4>
                            <p class="py-2 pb-4">{{movie.description}}</p>
                        </div>
                        <div id="bookBtn">
                            <button class="btn btn-primary px-5" onclick="singleMoviePage(this)" data="{{movie.id}}">Book</button>
                        </div>
                    </div>
                </div>
            {% endfor %}

        </div>
    </div>

</div>

<style>

@media (max-width: 1000px) {
    /* #bookBtn {
        margin-top: 20px;
    }

    #movie_details p{
        display : none;
    } */

    #card{
        border: 1px solid rgb(255, 130, 130);
        /* scale: 0.95; */
        margin-bottom: 10px;
    }
}

</style>

<script>

    function singleMoviePage(element)
    {

        let link = element.getAttribute("data")
        window.location.href = `/client/movie/${link}/`

    }




    

</script>

<script>

    $(document).ready(function(){

        console.log("Home Page Client")

        let cityIdElementTemp = $("#citySelect").val()
        
        if(cityIdElementTemp)
        {
            console.log(cityIdElementTemp)
            console.log("City id element tmep condition is true")
            loadMoviesFromCityFunc(cityIdElementTemp)
        }
        


        $("#citySelect").change(function(event){

            event.preventDefault()
            cityIdElement = $("#citySelect").val()
            loadMoviesFromCityFunc(cityIdElement)

        })



        function loadMoviesFromCityFunc(cityIdElement)
        {

            $.ajax({
                url : "/client/send-movies/",
                type : "POST",
                data : {
                    cityId : cityIdElement,
                    csrfmiddlewaretoken:$("input[name='csrfmiddlewaretoken']").val()
                },
                success : function(res)
                {
                    if(res.status)
                    {
                        all_cards_div = $("#allCardsDiv")

                        all_cards_div.empty()

                        let movies = res.movies


                        movies.forEach(movie => {

                            all_cards_div.append(`
                                <div class="col-3 col-sm-4 col-12 transition-all duration-300 ease-out hover:scale-95 hover:-translate-y-2 hover:shadow-2xl hover:bg-gray-100 hover:z-10 rounded-lg" id="card">
                                    <div id="card_part1">
                                        <img src="/media/${ movie.poster }" alt="err" >
                                    </div>
                                    <div id="card_part2" class="pb-3">
                                        <div id="movie_details">
                                            <h4 class="fw-bold h1">${movie.name}</h4>
                                            <p class="py-2 pb-4">${movie.description}</p>
                                        </div>
                                        <div id="bookBtn">
                                            <button class="btn btn-primary px-5" onclick="singleMoviePage(this)" data="${movie.id}">Book</button>
                                        </div>
                                    </div>
                                </div>
                            `)

                        });
                    }
                    else
                    {
                        alert(res.message)
                    }
                }
            })

        }
    })

</script>


{% endblock %}
